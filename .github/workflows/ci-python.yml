# Python CI — build wheel, install, and run examples.
#
# Builds the fox-agent-sdk Python package via maturin on all
# supported platforms (linux x86_64, macOS x86_64+arm64,
# Windows x86_64) and runs examples that do not require an API key.

name: Python CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.13"
        # Full matrix on ubuntu only (fastest runner)
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Restore cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: pip install maturin>=1.7,<2.0

      - name: Build wheel
        run: maturin build --release --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Run examples (no API key needed)
        working-directory: examples/python
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python evaluation_demo.py
          python hooks_config.py
