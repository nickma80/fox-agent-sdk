[workspace]
members = [
    "crates/fox-agent-core",
    "crates/fox-agent-providers",
    "crates/fox-agent-tools",
    "crates/fox-agent-mcp",
    "crates/fox-agent-swarm",
    "crates/fox-agent-sdk",
    "crates/fox-agent-py",
]
resolver = "3"

# Allow examples to use the root package as a binary target
[package]
name = "fox-agent-sdk-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[example]]
name = "simple_agent"
path = "examples/simple_agent.rs"

[[example]]
name = "multi_provider"
path = "examples/multi_provider.rs"

[[example]]
name = "permission_flow"
path = "examples/permission_flow.rs"

[[example]]
name = "swarm_workflow"
path = "examples/swarm_workflow.rs"

[[example]]
name = "custom_tool"
path = "examples/custom_tool.rs"

[[example]]
name = "general_agent"
path = "examples/general_agent.rs"

[[example]]
name = "mcp_integration"
path = "examples/mcp_integration.rs"

[[example]]
name = "langchain_users"
path = "examples/langchain_users.rs"

[[example]]
name = "planning_demo"
path = "examples/planning_demo.rs"

[[example]]
name = "tool_routing"
path = "examples/tool_routing.rs"

[[example]]
name = "safety_demo"
path = "examples/safety_demo.rs"

[dependencies]
fox-agent-sdk = { path = "crates/fox-agent-sdk" }
fox-agent-core = { path = "crates/fox-agent-core" }
fox-agent-mcp = { path = "crates/fox-agent-mcp" }
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1.5"
tempfile = "3"

[[bench]]
name = "agent_bench"
harness = false
path = "benches/agent_bench.rs"

[[bench]]
name = "tool_bench"
harness = false
path = "benches/tool_bench.rs"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nickma80/fox-agent-sdk"

[workspace.dependencies]
async-stream = "0.3.6"
anyhow = "1.0.99"
async-trait = "0.1.89"
bincode = "1.3.3"
futures = "0.3.31"
mistralrs = "0.7.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
vectorlite = "0.1.5"
uuid = { version = "1.18.0", features = ["v4"] }
tracing = "0.1.41"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
glob = "0.3.2"
ignore = "0.4.23"
regex = "1.11.1"
similar = "2.7.0"
urlencoding = "2.1.3"
dirs = "5.0.1"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.1.2" }
toml = "0.8"
pyo3 = "0.23"
pyo3-async-runtimes = "0.23"

# Reduce debug info to avoid Windows PDB size limits for large projects.
[profile.dev]
debug = "line-tables-only"
